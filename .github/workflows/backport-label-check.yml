name: Backport decision required

# Every PR into main must declare where it goes: one or more
# "backport <branch>" labels, or no-backport. The valid labels are derived from
# the release branches that actually exist, so they never go stale.
#
# Label names carry the real branch ("backport release/4.6") because that is
# what the backport action's capture group feeds to git checkout.

on:
  pull_request:
    types: [opened, reopened, labeled, unlabeled, synchronize]
    branches: [main]

permissions:
  contents: read

jobs:
  require-decision:
    name: Backport decision
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for a backport decision label
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          set -euo pipefail

          # Release branches that exist right now -> the labels we accept
          mapfile -t open_branches < <(
            git ls-remote --heads origin 'release/*' \
              | sed 's#.*refs/heads/#backport #' \
              | sort
          )

          valid=("no-backport" "${open_branches[@]}")

          echo "Accepted labels:"
          printf '  %s\n' "${valid[@]}"
          echo "PR labels: ${LABELS:-<none>}"

          picked=()
          IFS=',' read -ra applied <<< "${LABELS:-}"
          for l in "${applied[@]}"; do
            for v in "${valid[@]}"; do
              [ "$l" = "$v" ] && picked+=("$l")
            done
          done

          if [ ${#picked[@]} -eq 0 ]; then
            {
              echo "### Backport decision missing"
              echo
              echo "Add one of these labels before merging:"
              printf -- '- `%s`\n' "${valid[@]}"
              echo
              echo "Use \`no-backport\` when the fix does not apply to older versions"
              echo "(new feature, or the affected code does not exist there)."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::No backport decision label on this PR."
            exit 1
          fi

          # no-backport is exclusive: it cannot be combined with a target
          if printf '%s\n' "${picked[@]}" | grep -qx 'no-backport' \
             && [ ${#picked[@]} -gt 1 ]; then
            echo "::error::'no-backport' cannot be combined with a 'backport <branch>' label."
            exit 1
          fi

          echo "Decision: ${picked[*]}"
