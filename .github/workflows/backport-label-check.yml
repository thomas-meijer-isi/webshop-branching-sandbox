name: Backport decision required

# Every PR into main must declare where it goes: one or more backport/<version>
# labels, or no-backport. Accepted labels are derived from the release branches
# that exist, so they never go stale. backport.yml maps them back.

on:
  pull_request:
    types: [opened, reopened, labeled, unlabeled, synchronize]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: backport-label-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  require-decision:
    name: Backport decision
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Default depth: git ls-remote queries the remote, it needs no history.
      - uses: actions/checkout@v5

      - name: Check for a backport decision label
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          set -euo pipefail

          mapfile -t open_branches < <(
            git ls-remote --heads origin 'release/*' \
              | sed 's#.*refs/heads/release/#backport/#' \
              | sort
          )

          valid=("no-backport" "${open_branches[@]}")

          echo "Accepted labels:"
          printf '  %s\n' "${valid[@]}"
          echo "PR labels: ${LABELS:-<none>}"

          picked=()
          IFS=',' read -ra applied <<< "${LABELS:-}"
          for l in "${applied[@]}"; do
            for v in "${valid[@]}"; do
              [ "$l" = "$v" ] && picked+=("$l")
            done
          done

          if [ ${#picked[@]} -eq 0 ]; then
            {
              echo "### Backport decision missing"
              echo
              echo "Add one of these labels before merging:"
              printf -- '- `%s`\n' "${valid[@]}"
              echo
              echo "Use \`no-backport\` when the fix does not apply to older versions"
              echo "(new feature, or the affected code does not exist there)."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::No backport decision label on this PR."
            exit 1
          fi

          if printf '%s\n' "${picked[@]}" | grep -qx 'no-backport' \
             && [ ${#picked[@]} -gt 1 ]; then
            echo "::error::'no-backport' cannot be combined with a backport/* label."
            exit 1
          fi

          echo "Decision: ${picked[*]}"
