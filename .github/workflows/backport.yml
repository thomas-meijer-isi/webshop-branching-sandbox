name: Backport merged PR

# On merge, open one cherry-pick PR per "backport/<version>" label.
# On conflict the PR is opened anyway, with markers and instructions.
#
# Labels are named after the version ("backport/v4.6"), not the branch
# ("release/v4.6"). The backport action feeds its label_pattern capture group
# straight to git checkout, so it cannot do that translation itself -- there is
# no mapping input. The "Map backport labels to release branches" step below
# does it explicitly and passes the result via target_branches. label_pattern is
# deliberately set to a regex that matches nothing, so labels contribute no
# targets of their own.

on:
  pull_request_target:
    types: [closed]

permissions:
  contents: write        # push the cherry-picked branch
  pull-requests: write   # open the backport PR

jobs:
  backport:
    name: Create backport PRs
    runs-on: ubuntu-latest
    # Only merged PRs that actually carry a backport/ label
    if: >
      github.event.pull_request.merged &&
      contains(toJSON(github.event.pull_request.labels.*.name), '"backport/')
    steps:
      - uses: actions/checkout@v4

      - name: Map backport labels to release branches
        id: targets
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          set -euo pipefail

          targets=()
          IFS=',' read -ra applied <<< "${LABELS:-}"

          for l in "${applied[@]}"; do
            case "$l" in
              backport/*) ;;
              *) continue ;;
            esac

            # backport/v4.6 -> release/v4.6
            branch="release/${l#backport/}"

            # Refuse to guess. A label pointing at a branch that does not exist
            # is a naming mistake, and silently skipping it would look identical
            # to a deliberate decision not to backport.
            if ! git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              echo "::error::Label '$l' maps to branch '$branch', which does not exist."
              exit 1
            fi

            targets+=("$branch")
          done

          if [ ${#targets[@]} -eq 0 ]; then
            echo "::error::No backport/* label resolved to a release branch."
            exit 1
          fi

          echo "Targets: ${targets[*]}"
          echo "branches=${targets[*]}" >> "$GITHUB_OUTPUT"

      - name: Create backport pull requests
        uses: korthout/backport-action@v4
        with:
          # Matches nothing on purpose -- targets come from the mapping step.
          label_pattern: '^backport-never-matches/(?<target>.+)$'
          target_branches: ${{ steps.targets.outputs.branches }}
          branch_name: backport/${target_branch}/${pull_number}
          pull_title: '[${target_branch}] ${pull_title}'
          pull_description: |
            Automated cherry-pick of #${pull_number} onto `${target_branch}`.

            **Before merging**
            - [ ] A clean cherry-pick is not proof of correctness -- check the
                  surrounding code behaves the same way on this version

            If this cannot be cherry-picked sensibly, close this PR and write the
            fix directly against `${target_branch}` as its own PR. That is allowed.
            What is *not* allowed is leaving the version unfixed because the pick
            was awkward.
          copy_assignees: true
          copy_milestone: false
          add_author_as_assignee: true
