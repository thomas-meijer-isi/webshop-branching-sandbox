name: Backport PR check

# The backport action opens the PR even when the cherry-pick conflicted, so
# conflict markers can reach a release branch unnoticed. Whether the change is
# still correct on this older branch is not machine-checkable and stays with the
# reviewer.

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: ['release/**']

permissions:
  contents: read

concurrency:
  group: backport-pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  no-conflict-markers:
    name: No conflict markers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan added lines for conflict markers
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # Added lines only: a marker already in the base branch is not this
          # PR's problem. '|{7}' is the base section diff3/zdiff3 adds.
          if git diff "$BASE_SHA...$HEAD_SHA" \
               | grep -nE '^\+(<{7}|\|{7}|={7}|>{7})( |$)'; then
            {
              echo "### Unresolved cherry-pick"
              echo
              echo "This PR adds conflict markers. Resolve them before merging."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Conflict markers found in the diff."
            exit 1
          fi

          echo "No conflict markers in the diff."
