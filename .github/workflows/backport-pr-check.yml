name: Backport PR check

# Automates what the backport PR checklist can actually verify: that no conflict
# markers were left behind. The backport action opens the PR even when the
# cherry-pick conflicts, so the markers can reach a release branch unnoticed.
#
# The remaining checklist item -- whether the change is still correct on this
# older branch -- is not machine-checkable and stays with the reviewer.

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: ['release/**']

permissions:
  contents: read

jobs:
  no-conflict-markers:
    name: No conflict markers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan added lines for conflict markers
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # Only lines this PR adds. A pre-existing marker in the base branch is
          # someone else's problem and should not block this merge.
          if git diff "$BASE_SHA...$HEAD_SHA" \
               | grep -nE '^\+(<{7}|={7}|>{7})( |$)'; then
            {
              echo "### Unresolved cherry-pick"
              echo
              echo "This PR adds conflict markers. Resolve them before merging."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Conflict markers found in the diff."
            exit 1
          fi

          echo "No conflict markers in the diff."
